<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desmos Graphing Calculator — AI Team Intern Audit</title>
  <!-- Desmos API Script -->
  <script src="https://www.desmos.com/api/v1.9/calculator.js?apiKey=dcb377017b3d49f73ca08d993e6476e0"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #1e293b;
      padding: 12px 24px;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 {
      font-size: 18px;
      color: #38bdf8;
      font-weight: 700;
    }
    header p {
      font-size: 12px;
      color: #94a3b8;
    }
    .btn-group {
      display: flex;
      gap: 10px;
    }
    .btn {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: #0369a1; }
    .btn-success { background: #16a34a; }
    .btn-success:hover { background: #15803d; }
    #calculator {
      flex: 1;
      width: 100%;
      height: calc(100vh - 65px);
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>AI Team Intern Audit — Complete Multi-Part Desmos Graph</h1>
      <p>Clean Reset via removeExpressions()</p>
    </div>
    <div class="btn-group">
      <button class="btn btn-success" onclick="copyConsoleScript()">📋 Copy Working Reset Script</button>
      <a href="https://www.desmos.com/calculator/ebhw7wvtzf" target="_blank" style="text-decoration:none;">
        <button class="btn">🚀 Open Desmos.com Link</button>
      </a>
    </div>
  </header>

  <div id="calculator"></div>

  <script>
    var elt = document.getElementById('calculator');
    var calculator = Desmos.GraphingCalculator(elt, {
      expressions: true,
      settingsMenu: true,
      zoomButtons: true,
      border: false
    });

    var mathExpressions = [
      // Folder 1: Part A Tokenizer Fertility Audit
      { id: 'f1', type: 'folder', title: 'Part A: Tokenizer Fertility Audit' },
      { id: 'e1', folderId: 'f1', latex: 'F_{eng}(x) = 1.15 x', color: '#2d70b3' },
      { id: 'e2', folderId: 'f1', latex: 'F_{hin}(x) = 2.45 x', color: '#388c46' },
      { id: 'e3', folderId: 'f1', latex: 'F_{kan}(x) = 3.90 x', color: '#fa7e19' },
      { id: 'e4', folderId: 'f1', latex: 'F_{tam}(x) = 4.10 x', color: '#d64545' },
      { id: 'e5', folderId: 'f1', latex: 'F_{xlm}(x) = 1.35 x', color: '#6042a6' },
      { id: 'p1', folderId: 'f1', latex: 'A_{flaw} = (10, 39)', color: '#fa7e19', label: 'Kannada Subword Explosion (3.9x)', showLabel: true },

      // Folder 2: Part B Serving Capacity & Preemption Boundary (L4 24GB)
      { id: 'f2', type: 'folder', title: 'Part B: Serving Capacity & Preemption Boundary (L4 24GB)' },
      { id: 'v_kv', folderId: 'f2', latex: 'V_{kv} = 12.08' },
      { id: 'm_tok', folderId: 'f2', latex: 'm_{tok} = 0.000114688' },
      { id: 'ram_ceiling', folderId: 'f2', latex: 'y = 12.08', color: '#d64545', lineStyle: 'DASHED', label: 'Net KV RAM Ceiling (12.08 GB)', showLabel: true },
      { id: 'c_seq', folderId: 'f2', latex: 'C(x) = \\frac{12.08}{0.000114688 \\cdot x}', color: '#2d70b3', label: 'Max Concurrency C(x)' },
      { id: 'p_max', folderId: 'f2', latex: 'P_{max} = (4096, 25.71)', color: '#2d70b3', label: 'Max Capacity = 25.7 seqs', showLabel: true },
      { id: 'm_b24', folderId: 'f2', latex: 'M_{24}(x) = 24 \\cdot 0.000114688 \\cdot x', color: '#fa7e19', lineStyle: 'DASHED' },
      { id: 'p_b24', folderId: 'f2', latex: 'P_{b24} = (4096, 11.27)', color: '#fa7e19', label: 'Batch 24 RAM = 11.27 GB', showLabel: true },
      { id: 'm_b32', folderId: 'f2', latex: 'M_{32}(x) = 32 \\cdot 0.000114688 \\cdot x', color: '#d64545' },
      { id: 'p_preempt', folderId: 'f2', latex: 'P_{preempt} = (3291, 12.08)', color: '#d64545', label: 'Preemption OOM at 3291 tokens', showLabel: true },
      { id: 'g_goodput', folderId: 'f2', latex: 'G(x) = 1607.4 \\cdot \\frac{512}{x + 512}', color: '#388c46' },
      { id: 'p_goodput', folderId: 'f2', latex: 'P_{goodput} = (3584, 200.92)', color: '#388c46', label: 'True Goodput = 200.9 tok/s', showLabel: true },

      // Folder 3: Part C Indic Casualization Strategy
      { id: 'f3', type: 'folder', title: 'Part C: Indic Casualization Strategy' },
      { id: 'opt_a', folderId: 'f3', latex: 'L_{lora} = (120, 91)', color: '#2d70b3', label: 'Option A: LoRA SFT (120ms, 91%)', showLabel: true },
      { id: 'opt_b', folderId: 'f3', latex: 'L_{agent} = (2620, 89)', color: '#d64545', label: 'Option B: Rewriter Agent (REJECTED)', showLabel: true },
      { id: 'opt_c', folderId: 'f3', latex: 'L_{prompt} = (135, 88)', color: '#388c46', label: 'Option C: System Prompt (RECOMMENDED)', showLabel: true }
    ];

    calculator.setExpressions(mathExpressions);
    calculator.setMathBounds({ left: -500, right: 4500, bottom: -20, top: 300 });

    function copyConsoleScript() {
      var scriptText = "Calc.removeExpressions(Calc.getExpressions());\n" +
                       "Calc.setExpressions(" + JSON.stringify(mathExpressions) + ");\n" +
                       "Calc.setMathBounds({ left: -500, right: 4500, bottom: -20, top: 300 });";
      navigator.clipboard.writeText(scriptText).then(function() {
        alert("Copied Reset Script! Paste into Chrome Console and click Save!");
      });
    }
  </script>
</body>
</html>
