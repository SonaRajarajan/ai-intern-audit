<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desmos Graphing Calculator — AI Team Intern Audit</title>
  <!-- Desmos API Script -->
  <script src="https://www.desmos.com/api/v1.9/calculator.js?apiKey=dcb377017b3d49f73ca08d993e6476e0"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #1e293b;
      padding: 14px 24px;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 {
      font-size: 20px;
      color: #38bdf8;
      font-weight: 700;
    }
    header p {
      font-size: 13px;
      color: #94a3b8;
    }
    .badge {
      background: #0284c7;
      color: #fff;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
    }
    #calculator {
      flex: 1;
      width: 100%;
      height: calc(100vh - 65px);
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>AI Team Intern Audit — Complete Desmos Mathematical Graph</h1>
      <p>Interactive graph deriving Part A (Tokenizer Fertility), Part B (KV Cache & Concurrency), Part C (Casualization)</p>
    </div>
    <span class="badge">Official Audit Graph</span>
  </header>

  <div id="calculator"></div>

  <script>
    var elt = document.getElementById('calculator');
    var calculator = Desmos.GraphingCalculator(elt, {
      expressions: true,
      settingsMenu: true,
      zoomButtons: true,
      border: false
    });

    // Set graph math state with all 3 Parts pre-configured
    calculator.setExpressions([
      // Folder 1: Part A Tokenizer Fertility Audit
      { id: 'f1', type: 'folder', title: 'Part A: Tokenizer Fertility & Typology Audit' },
      { id: 'e1', folderId: 'f1', latex: 'F_{eng}(x) = 1.15 x', color: '#2d70b3', label: 'English Baseline (GPT-2 Fertility = 1.15)', showLabel: true },
      { id: 'e2', folderId: 'f1', latex: 'F_{hin}(x) = 2.45 x', color: '#388c46', label: 'Hindi (GPT-2 Fertility = 2.45)', showLabel: true },
      { id: 'e3', folderId: 'f1', latex: 'F_{kan}(x) = 3.90 x', color: '#fa7e19', label: 'Kannada Agglutinative (GPT-2 Fertility = 3.90)', showLabel: true },
      { id: 'e4', folderId: 'f1', latex: 'F_{tam}(x) = 4.10 x', color: '#d64545', label: 'Tamil Agglutinative (GPT-2 Fertility = 4.10)', showLabel: true },
      { id: 'e5', folderId: 'f1', latex: 'F_{xlm}(x) = 1.35 x', color: '#6042a6', label: 'XLM-RoBERTa Dravidian (Fertility = 1.35)', showLabel: true },
      { id: 'p1', folderId: 'f1', latex: 'A_{flaw} = (10, 39)', color: '#fa7e19', label: 'GPT-2 Kannada Subword Explosion (3.9x vs Eng)', showLabel: true },

      // Folder 2: Part B Serving Capacity & Preemption Thrashing
      { id: 'f2', type: 'folder', title: 'Part B: Serving Capacity & Preemption Thrashing (NVIDIA L4 24GB)' },
      { id: 'v_kv', folderId: 'f2', latex: 'V_{kv} = 12.08' },
      { id: 'm_tok', folderId: 'f2', latex: 'm_{tok} = 0.000114688' },
      { id: 'c_seq', folderId: 'f2', latex: 'C(x) = \\frac{V_{kv}}{m_{tok} \\cdot x}', color: '#2d70b3', label: 'Max Concurrency Capacity C(x)', showLabel: true },
      { id: 'p_max', folderId: 'f2', latex: 'P_{max} = (4096, 25.71)', color: '#2d70b3', label: '4096-Tok Max Capacity = 25.71 seqs', showLabel: true },
      { id: 'm_b24', folderId: 'f2', latex: 'M_{24}(x) = 24 \\cdot m_{tok} \\cdot x', color: '#fa7e19', lineStyle: 'DASHED', label: 'Batch 24 KV RAM (GB)', showLabel: true },
      { id: 'p_b24', folderId: 'f2', latex: 'P_{b24} = (4096, 11.27)', color: '#fa7e19', label: 'Batch 24 at 4096 Tok = 11.27 GB (93% KV RAM)', showLabel: true },
      { id: 'm_b32', folderId: 'f2', latex: 'M_{32}(x) = 32 \\cdot m_{tok} \\cdot x', color: '#d64545', label: 'Batch 32 KV RAM (OOM Branch)', showLabel: true },
      { id: 'p_preempt', folderId: 'f2', latex: 'P_{preempt} = (3291, 12.08)', color: '#d64545', label: 'PREEMPTION THRESHOLD: Batch 32 OOMs at 3291 Tok!', showLabel: true },
      { id: 'ram_ceiling', folderId: 'f2', latex: 'y = 12.08', color: '#d64545', lineStyle: 'DASHED', label: 'Net KV RAM Ceiling (12.08 GB)', showLabel: true },
      { id: 'g_goodput', folderId: 'f2', latex: 'G(x) = 1607.4 \\cdot \\frac{512}{x + 512}', color: '#388c46', label: 'True Output Generation Goodput G(x)', showLabel: true },
      { id: 'p_goodput', folderId: 'f2', latex: 'P_{goodput} = (3584, 200.92)', color: '#388c46', label: 'Batch 24 Goodput = 200.92 tok/s (8.0x lower than v0)', showLabel: true },
      { id: 'th_v0', folderId: 'f2', latex: 'y = 1607.4', color: '#6042a6', lineStyle: 'DASHED', label: 'v0 Flawed Total Throughput (1607.4 tok/s)', showLabel: true },

      // Folder 3: Part C Indic Casualization Strategy & Reviewer Capacity
      { id: 'f3', type: 'folder', title: 'Part C: Indic Casualization Strategy & Reviewer Capacity' },
      { id: 'r_max', folderId: 'f3', latex: 'R_{max} = 300', color: '#d64545', lineStyle: 'DASHED', label: '1 Reviewer 10h/wk (2 wks) = 300 Max Evaluated Examples', showLabel: true },
      { id: 'opt_a', folderId: 'f3', latex: 'L_{lora} = (120, 91)', color: '#2d70b3', label: 'Option A: LoRA SFT (120ms, 91% acc)', showLabel: true },
      { id: 'opt_b', folderId: 'f3', latex: 'L_{agent} = (2620, 89)', color: '#d64545', label: 'Option B: Rewriter Agent (2620ms - REJECTED)', showLabel: true },
      { id: 'opt_c', folderId: 'f3', latex: 'L_{prompt} = (135, 88)', color: '#388c46', label: 'Option C: System Prompt (135ms, 88% acc - RECOMMENDED)', showLabel: true }
    ]);

    // Set initial viewport range for standard viewing
    calculator.setMathBounds({
      left: -200,
      right: 4500,
      bottom: -50,
      top: 1800
    });
  </script>
</body>
</html>
